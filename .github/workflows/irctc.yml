name: IRCTC Automation Booking

on:
  workflow_dispatch:
    inputs:
      USERNAME:
        required: true
        type: string
        description: "Your IRCTC Username"
      PASSWORD:
        required: true
        type: string
        description: "Your IRCTC Password"
      UPI_ID:
        required: false
        type: string
        description: "Your UPI ID To Make Payment From"

jobs:
  IRCTC-Booking:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          pip install -r irctc-captcha-solver/requirements.txt

      - name: Install Node.js and dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "20.12.2"
          cache: "npm"

      - name: Install NPM packages
        shell: bash
        run: |
          npm install

      - name: Start Captcha OCR Server
        shell: bash
        run: |
          # Start app-server in background and wait for port 5000 to be responsive
          python3 irctc-captcha-solver/app-server.py --host 0.0.0.0 --port 5000 &
          npx wait-on http://localhost:5000 --timeout 60000

      - name: Run IRCTC Cypress Automation
        shell: bash
        env:
          USERNAME: ${{ inputs.USERNAME }}
          PASSWORD: ${{ inputs.PASSWORD }}
          UPI_ID: ${{ inputs.UPI_ID }}
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --env "UPI_ID=${UPI_ID},USERNAME=${USERNAME},PASSWORD=${PASSWORD}"
